<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>lists in html</h2>
    <h2>unordered list</h2>
    <p>tag is used to define unordered list</p>
    <ul>
        <li>rice</li>
        <li>beans</li>
        <li>potato</li>
        </ul>
        <p>ol tag is used to define ordered list</p>
        <ol type="A">
            <li>beans</li>
            <li>rice</li>
            <li>potato</li>
            </ol>
            <button style="background-color: blue; color: white; border-radius: 8px;">submit</button>
            <input  type="submit" style="background-color: blue;color: white;">
</body>
</html>
