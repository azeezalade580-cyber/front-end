<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE STORE Premium fashion</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            display: flex;
            flex-direction: column;
            height: 80px;
            width: 100%;
        }
        .head-top{
            display: flex;
            background-color: black;
            height: 35px;
            justify-content: center;
            color: white;
            align-items: center;
        }
        head-bot{
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            padding-left: 80px;
            padding-right: 80px;
            box-shadow: 1px 2px 3px rgba(0, 0, 0, 0);
        }
        .left{
            display: flex;
            gap: 4px;
        }
        .luxe{
            font-size: 2.5rem;
        }
        .dot{
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: orange;
            margin-top: 32px;
        }
        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-left: 5px;
        }
        .right{
            display: flex;
            gap: 5px;
        }
        nav a {
            text-decoration: none;
            color: black;
        }
        nav a:hover{
            color: blue;
        }
        .right{
            display: flex;
            height: 200px;
            width: 100%;
            margin: auto;
        }
        .hero{
            display: flex;
        }
    </style>
</head>
<body>
<header>
    <div class="head-top">
        <h3>FREE SHIPPING ON ORDERS ABOVE $100,000</h3>
    </div>
    <div class="head-bot">
    <div class="left">
       <div class="luxe">LUXE</div> 
       <div class="dot"></div>
    <nav>
        <a href="#">home</a>
        <a href="#">shop</a>
        <a href="#">categories</a>
        <a href="#">about</a>
    </nav>
    </div>
    <div class="right">
        <img src="portugal.jpg" alt="background">
    </div>
    </div>
    </div>
    <div class="hero">
        <p>NEW COLLECTION 2026</p>
        <P>Style that</P>
        <p>speaks for you</p>
        <p>discover timeless fashion pieces designed to make every
            moment unforgettable.
        </p>
        <button>SHOP COLLECTION</button>
    </div>
    <div class="">

    </div>
</header>
</body>
</html>
