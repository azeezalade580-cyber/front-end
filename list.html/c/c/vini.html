<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
  
        .container{
            width: 100%;
            margin: 0 auto;
            padding: 0 24px
        }
        header{
            padding: 25px;
           
        }
        .nav-container{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo{
            font-size: 24px;
            text-decoration: none;
            color: blue;
        }
        .nav-list{
            display: flex;
            list-style: none;
            gap: 30px;
        }
        .nav-list a{
            text-decoration: none;
        }
        button{
            display: flex;
            background-color: blue;
            color: white;
            border-radius: 5px;
            text-decoration: underline;
            width: 100px;
            height: 40px;
            justify-content: center;
            align-items: center;
        }
        .slide{
            text-align: center;
            margin-top: 30px;
        }
        h1{
            font-size: 60px;
            color: black;
        }
        p{
            font-size: 20px;
        }
        .seed{
            display: flex;
            margin: auto;
            margin-top: 30px;
            width: 180px;
            height: 40px;
            text-decoration: none;


        }
        .card-container{
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: white;
        }
        .card{
            border-radius: 15px;
            border: 1px solid aliceblue;
            display: flex;
            flex-direction: column;
            margin: auto;
            width: 250px;
            height: 2500px;
            align-items: center;
            margin-top: 30px;
            background-color: white;
        }
    </style>
</head>
<body>
    <header class="container">
    <nav class="nav-container">
        <a href="#" class="logo">LoanAptech</a>
    <ul class="nav-list">
        <li><a href="#">home</a></li>
        <li><a href="#">loans</a></li>
        <li><a href="#">about</a></li>
        <li><a href="#">contact</a></li>
        <li><a href="#">login</a></li>
        <button>sign up</button>
    </nav>
    </ul>
    </header>
    <div class="slide">
    <h1>Welcome to LoanAptech</h1>
        <p>Get instant personal loans up to $50,000 with low interest rates and flexible <br>repayment options.</p>
        <button class="seed">Apply Now,It's Free</button>
    </div>
    <div class="card-container">
    <div class="card">
      <h3>lighting fast</h3>  
        <h4>light fast Approval</h4>
        <p>get decision in under 10 minutes</p>
    </div>
    </div>
    <div class="card-container">
        <div class="card">
            
        </div>
    </div>
</body>
</html>
