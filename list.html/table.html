<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 1px solid black;
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            text-align: center;
        }
        tr:hover {
            background-color: blue;
            color: white;
        }
        tr:nth-child(2n+1) {
            background-color: green;
            color: white;
        }
        tr:nth-child(2n) {
            background-color: grey;
            color: white;
        }
    </style>
</head>
<body>
    <h2>tables in html</h2>
    <p>table tag is used to define table in html</p>
    <p>tr is used to define table row</p>
    <p>th is used to define table head</p>
    <p>td is used to define table data</p>
    <table>
        <tr>
            <th>Name</th>
            <th>age</th>
            <th>city</th>
        </tr>
        <tr>
        <td>fola</td>
        <td>20</td>
        <td>ibadan</td>
        </tr>
        <tr>
        <td>fola yemi</td>
        <td>26</td>
        <td>ibadan</td>
    </tr>
    <tr>
        <td>ade</td>
        <td>19</td>
        <td>osun</td>
    </tr>
    <tr>
        <td>ola</td>
        <td>29</td>
        <td>osogbo</td>
    </tr>
</body>
</html>
