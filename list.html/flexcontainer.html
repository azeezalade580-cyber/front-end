<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            width: 400px;
            height: 300px;
            border-radius: 15px;
            background-color: blue;
            gap: 20px;
            margin: auto;
            justify-content: space-around;
            flex-wrap: wrap-reverse;
            
            
        }
         div {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: green;
            color: white;
            width: 100px;
            height: 80px;
            border-radius: 10px;
            text-align: center;
            
           
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div>apple</div>
        <div>bananna</div>
        <div>mango</div>
        <div>guava</div>
        <div>orange</div>
        <div>lemon</div>
        <div>pineapple</div>
        <div>grape</div>

    </div>
</body>
</html>
