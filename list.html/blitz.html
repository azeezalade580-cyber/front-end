<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            border-radius: 15px;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            margin: auto;
            width: 300px;
            min-height: 300px;
            align-items: center;
        }
        img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin-top: 10px;
        }
        p {
            text-align: center;
        }
        button {
            width: 100px;
            height: 40px;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            background-color: blue;
            color: white;
        }
        button:hover {
            background-color: royalblue;
            color: white;
            transform: scale(1.1);
        }

    </style>
</head>
<body>
    <div class="card">
        <img src="portugal.jpg" alt="profile picture">
        <h2>john doe</h2>
        <p>webdeveloper who loves html.I am anticipating to be one of them</p>
        <button>viewprofile</button>
    </div>
    <div class="card">
        <img src="portugal.jpg" alt="profile picture">
        <h2>jane smith</h2>

    </div>
    <div class="card">
        <img src="portugal.jpg" alt="profile picture">
        <h2>micheal lee</h2>
        <p>backened developer</p>
        <button>view profile</button>
    </div>
</body>
</html>
